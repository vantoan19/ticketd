[package]
name = "ticketd-core"
description = "Shared domain operations and queries for ticketd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `clock` reads the local time a schedule is evaluated in.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "6"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup", "blob", "functions"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
thiserror = "2"
tracing.workspace = true
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
pulldown-cmark = "0.13"
ureq = "3"
url = "2"
regex = "1"
base64 = "0.23"
saphyr = { version = "0.3", default-features = false }

[features]
# Gives every new Workspace the device code KQ. For tests only: see src/device.rs.
test-device-code = []
# Builds the in-memory storage that sync tests run against. For tests only.
fake-remote = []
# Adds `Workspace::open_with_lock_waits`. For tests only; changes no default.
test-lock-waits = []
# Adds `create_workspace_at_format_version`: a Workspace file at an older format version,
# built by the real migration ladder. For tests only; changes no default.
test-schema = []

[dev-dependencies]
# Turns the fixed device code and the fake storage on for this crate's own tests.
ticketd-core = { path = ".", features = ["test-device-code", "fake-remote", "test-lock-waits", "test-schema"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
