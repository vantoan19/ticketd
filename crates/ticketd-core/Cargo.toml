[package]
name = "ticketd-core"
description = "Shared domain operations and queries for ticketd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6"
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "backup", "blob", "functions"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
pulldown-cmark = "0.13"
ureq = "3"
url = "2"
base64 = "0.23"
saphyr = { version = "0.3", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
