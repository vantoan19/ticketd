[package]
name = "ticketd-automation-runner"
description = "Runs ticketd Automations: matches Workspace events, starts queued runs and executes their steps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ticketd-core.workspace = true
ticketd-chat-host.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
# Tests assert literal Ticket references, so they build the fixed device code in.
ticketd-core = { workspace = true, features = ["test-device-code", "fake-remote"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
