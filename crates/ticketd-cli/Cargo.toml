[package]
name = "ticketd-cli"
description = "Agent-facing command line for ticketd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "ticketd"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
ticketd-core.workspace = true
ticketd-diagnostics.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
# raw_value lets the CLI drop one key from a record without reordering the rest.
serde_json = { version = "1", features = ["raw_value"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ticketd-chat-host.workspace = true
# The CLI's tests assert literal Ticket references, so they build the fixed device code in.
ticketd-core = { workspace = true, features = ["test-device-code"] }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
