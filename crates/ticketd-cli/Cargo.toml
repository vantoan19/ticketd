[package]
name = "ticketd-cli"
description = "Agent-facing command line for ticketd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ticketd"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
ticketd-core.workspace = true
clap.workspace = true
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
