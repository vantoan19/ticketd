[package]
name = "ticketd-chat-host"
description = "Chat supervisor and harness adapter contract for ticketd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agent-client-protocol-schema = { version = "=1.21.2", default-features = false }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ticketd-core.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
# Tests assert literal Ticket references, so they build the fixed device code in.
ticketd-core = { workspace = true, features = ["test-device-code"] }
# Tests read what reaches the log folder, as the logging standard says.
ticketd-diagnostics.workspace = true
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
