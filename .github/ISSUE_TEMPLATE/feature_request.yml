name: Suggest an improvement
description: Describe friction in an existing ticketd workflow and a better outcome.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Add your experience to an existing proposal when it covers the same workflow.
        [How proposals are triaged](https://github.com/vantoan19/ticketd/blob/main/docs/agents/triage-labels.md#triage-an-issue).
  - type: textarea
    id: workflow
    attributes:
      label: How do you do this in ticketd today?
      description: Walk us through the steps and where they become difficult.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a better outcome look like?
      description: Describe the difference you would notice.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples, workarounds, or possible approaches
      description: Include relevant platform, accessibility, or compatibility needs if useful.
