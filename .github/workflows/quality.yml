name: Quality

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Build platform distributions
        type: boolean
        default: false
      linux_only:
        description: Build only the Linux distribution
        type: boolean
        default: false
      native_smoke:
        description: Run the Linux native desktop smoke test
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # Nightly run of the platform checks on main (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run. The "labeled" run gets its own group, so
# adding a label never cancels the Linux checks already running for the PR. Pushes to main queue.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # Runs on the self-hosted Linux runner, so it uses no hosted minutes. The "labeled" event
    # only exists to start the platform checks, so this job skips it.
    if: github.event.action != 'labeled' && (github.event_name != 'workflow_dispatch' || (!inputs.native_smoke && !inputs.distribution))
    name: Quality checks (Linux)
    runs-on: ticketd-linux
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install Linux desktop dependencies
        # The self-hosted runner has these packages preinstalled and no passwordless sudo.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build
      - run: ./scripts/check
      - name: Build desktop and CLI
        run: cargo build --workspace --locked

  platform:
    # macOS and Windows minutes are billed per minute, so these run only on pushes to main, the
    # nightly schedule, manual runs, and pull requests labeled platform-check. Linux covers the
    # Markdown, lint, type, and frontend checks, so this job runs only the Rust workspace.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.native_smoke && !inputs.distribution) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'platform-check'))
    name: Platform checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Tauri embeds ../dist at compile time, so the frontend must be built before cargo runs.
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build desktop and CLI
        run: cargo build --workspace --locked

  native-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke && !inputs.distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install desktop and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: rustup show active-toolchain
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build
      - run: npm run desktop -- build --debug --no-bundle
      - run: cargo build -p ticketd-cli --locked
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Run real desktop refresh smoke test
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          active_group=
          stop_group() {
            local group="$1" attempt
            if kill -0 -- "-$group" 2>/dev/null; then
              kill -TERM -- "-$group" 2>/dev/null || true
              for attempt in {1..40}; do
                if ! kill -0 -- "-$group" 2>/dev/null; then return 0; fi
                sleep 0.25
              done
              kill -KILL -- "-$group" 2>/dev/null || true
              for attempt in {1..20}; do
                if ! kill -0 -- "-$group" 2>/dev/null; then return 0; fi
                sleep 0.25
              done
              echo "Native smoke process group $group did not stop" >&2
              return 1
            fi
          }
          cleanup() {
            local status=$? attempt
            trap - EXIT
            if [[ -n "$active_group" ]]; then stop_group "$active_group" || status=1; fi
            for attempt in {1..20}; do
              if rm -rf "$XDG_DATA_HOME"; then exit "$status"; fi
              sleep 0.25
            done
            echo "Could not remove native smoke workspace: $XDG_DATA_HOME" >&2
            exit 1
          }
          trap cleanup EXIT
          run_native() {
            local script="$1" status=0
            setsid xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node "$1"' sh "$script" &
            active_group=$!
            wait "$active_group" || status=$?
            stop_group "$active_group" || status=1
            active_group=
            return "$status"
          }
          run_native tests/native/refresh.mjs
          XDG_DATA_HOME="$XDG_DATA_HOME/extensions" run_native tests/native/extensions.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: native-smoke-screenshots
          path: native-extensions-*.png
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: native-smoke-diagnostics
          path: native-failure.*
          if-no-files-found: ignore
          retention-days: 7

  distribution:
    if: github.event_name == 'workflow_dispatch' && inputs.distribution
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"os":"ubuntu-24.04","platform":"ubuntu-24.04-x86_64","bundle":"deb","installer":"target/release/bundle/deb/*.deb","cli":"target/release/ticketd"}]' || '[{"os":"macos-26","platform":"macos-arm64","bundle":"dmg","installer":"target/release/bundle/dmg/*.dmg","cli":"target/release/ticketd"},{"os":"ubuntu-24.04","platform":"ubuntu-24.04-x86_64","bundle":"deb","installer":"target/release/bundle/deb/*.deb","cli":"target/release/ticketd"},{"os":"windows-2025","platform":"windows-x86_64","bundle":"msi","installer":"target/release/bundle/msi/*.msi","cli":"target/release/ticketd.exe"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup show active-toolchain
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Check package versions
        run: node scripts/check-versions.mjs
      - name: Build CLI
        run: cargo build --release --locked -p ticketd-cli
      - name: Build desktop installer
        run: npm run desktop -- build --bundles ${{ matrix.bundle }} -- --locked
      - name: Smoke-test installed Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.1.0 --locked
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          package=$(dpkg-deb -f target/release/bundle/deb/*.deb Package)
          export XDG_DATA_HOME="$(mktemp -d)"
          export TICKETD_SMOKE_CHECKOUT="$PWD"
          export TICKETD_SMOKE_CLI="$PWD/target/release/ticketd"
          export TICKETD_SMOKE_DESKTOP=/usr/bin/ticketd-desktop
          trap 'rm -rf "$XDG_DATA_HOME"' EXIT
          xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/install.mjs'
          XDG_DATA_HOME="$XDG_DATA_HOME/refresh" xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/refresh.mjs'
          XDG_DATA_HOME="$XDG_DATA_HOME/workflow" xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/workflow.mjs'
          sudo apt-get remove -y "$package"
          "$TICKETD_SMOKE_CLI" list | node -e 'let s=""; process.stdin.on("data", x => s += x); process.stdin.on("end", () => { if (!JSON.parse(s).some(t => t.title === "Created while desktop was closed")) process.exit(1); });'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && runner.os == 'Linux'
        with:
          name: installed-workflow-diagnostics
          path: native-failure.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble download
        run: |
          mkdir -p distribution
          cp ${{ matrix.installer }} distribution/
          cp ${{ matrix.cli }} distribution/
          cp docs/install.md distribution/INSTALL.md
      - name: Smoke-test CLI installation and discovery
        run: node tests/native/cli-install.mjs ${{ matrix.cli }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ticketd-${{ matrix.platform }}
          path: distribution/
          if-no-files-found: error
          retention-days: 7
