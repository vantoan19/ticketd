name: Quality

on:
  workflow_dispatch:
  pull_request:
    # `labeled` makes adding the ci-full label start a run that runs everything.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # Nightly run on main, to catch runner image and toolchain drift (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  # Line tables keep file and line numbers in panic backtraces; full debug info only made the
  # build, the cache and every link larger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

# A new push to a PR cancels that PR's superseded run. Every main commit gets its own group, so a
# later merge never replaces a queued run and each main commit keeps its own result.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Decides which jobs this change needs; see scripts/ci-plan.mjs and ADR 0023. A path that
    # matches no rule, a git failure, a push to main, the nightly run, a manual run and the
    # ci-full label all plan every job. CI result fails unless the jobs followed the plan.
    name: Change plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      rust: ${{ steps.plan.outputs.rust }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # A pull request checks out its merge commit; HEAD^1 is the base branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        env:
          PLAN_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/check plan HEAD^1

  fast:
    # Everything that compiles nothing, so formatting, lint and type errors report in minutes.
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          rust: true
      - run: ./scripts/check fast
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  clippy:
    # Clippy has its own job, so it never waits for the tests and the tests never wait for it.
    name: Clippy
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          rust: true
          desktop: true
          cache: clippy
      # Tauri embeds ../dist at compile time, so the frontend must be built before cargo runs.
      - run: npm run build
      - run: ./scripts/check clippy

  rust:
    # The Rust tests on all three release platforms, split into shards that run side by side.
    # Every shard compiles its own tests and runs its share of them; the shards of one OS share
    # one build cache. Shard 1 of each OS also runs the doc-tests; the last shard also builds the
    # desktop and CLI (and checks the Pages URLs on Windows), so the extra work is not all in one shard.
    name: Rust tests (${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, shard: 1, shards: 1 }
          - { name: macOS, os: macos-latest, shard: 1, shards: 2 }
          - { name: macOS, os: macos-latest, shard: 2, shards: 2 }
          - { name: Windows, os: windows-latest, shard: 1, shards: 3 }
          - { name: Windows, os: windows-latest, shard: 2, shards: 3 }
          - { name: Windows, os: windows-latest, shard: 3, shards: 3 }
    runs-on: ${{ matrix.os }}
    # A shard takes under 20 minutes with a warm cache; a cold cache on a PR adds the compile.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          rust: true
          desktop: ${{ runner.os == 'Linux' }}
          nextest: true
          cache: test
      # Tauri embeds ../dist at compile time, so the frontend must be built before cargo runs.
      - run: npm run build
      - name: Check nested Pages URLs on Windows
        if: runner.os == 'Windows' && matrix.shard == matrix.shards
        env:
          DOCS_PROJECT_PAGES: "1"
        run: |
          npm run build:docs
          node apps/docs/check-pages.mjs
      - name: Test Rust workspace
        run: ./scripts/check rust --partition ${{ matrix.shard }}/${{ matrix.shards }}
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.name }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      # This replaces target/debug/ticketd, which the tests built with a fixed device code.
      - name: Build desktop and CLI
        if: matrix.shard == matrix.shards
        run: cargo build --workspace --locked

  ui:
    # The frontend tests need no Rust build, so they run beside the Rust jobs, in three shards.
    name: Frontend tests (${{ matrix.shard }}/3)
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: ./scripts/check ui --partition ${{ matrix.shard }}/3
      - name: Build and check the GitHub Pages site
        if: matrix.shard == 1
        env:
          DOCS_PROJECT_PAGES: "1"
        run: |
          npm run build:docs
          node apps/docs/check-pages.mjs

  result:
    # The one required check. It always reports. It passes only when the plan job succeeded,
    # every job the plan asked for succeeded and every other job was skipped, so a failed,
    # canceled or wrongly skipped job can never look like a pass.
    name: CI result
    if: always()
    needs: [plan, fast, clippy, rust, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Summarize run times
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          # Queue and run time per job, so slow feedback shows up as waiting or as work.
          gh api --paginate "$RUN_URL/jobs" --jq '.jobs[]' | jq -rs '
            def t: fromdateiso8601;
            def mins: (. / 60 * 10 | round / 10 | tostring) + " min";
            (map(select(.name != "CI result")) | sort_by(.started_at)) as $jobs
            | ($jobs | map(.created_at | t) | min) as $start
            | "| Job | Result | Queued | Ran | Done after |",
              "| --- | --- | --- | --- | --- |",
              ($jobs[] | select(.completed_at != null and .started_at != null)
                | "| \(.name) | \(.conclusion) | \((.started_at | t) - (.created_at | t) | mins) | \((.completed_at | t) - (.started_at | t) | mins) | \((.completed_at | t) - $start | mins) |")
          ' >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read job timings for the summary."
      - name: Require the planned jobs to succeed and the rest to be skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.mjs result
