name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly run on main, to catch runner image and toolchain drift (03:17 UTC).
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run. Every main commit gets its own group, so a
# later merge never replaces a queued run and each main commit keeps its own result.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    # Everything that compiles nothing, so formatting, lint and type errors report in minutes.
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: ./scripts/check fast
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  quality:
    # PR code runs on a fresh GitHub-hosted VM. Clippy, Rust tests and the desktop build.
    name: Quality checks (Linux)
    runs-on: ubuntu-24.04
    # About 20 minutes without a warm cache: Clippy, test build, then 13 minutes of tests.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache. PRs read it and never fill the shared storage.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm install --global npm@10.9.2
      - run: npm ci
      # Tauri embeds ../dist at compile time, so the frontend must be built before cargo runs.
      - run: npm run build
      - run: ./scripts/check rust
      - name: Build desktop and CLI
        run: cargo build --workspace --locked

  ui:
    # The frontend tests need no Rust build, so they run beside the Rust job.
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: ./scripts/check ui
      - name: Build and check the GitHub Pages site
        env:
          DOCS_PROJECT_PAGES: "1"
        run: |
          npm run build:docs
          node apps/docs/check-pages.mjs

  platform:
    # Rust tests and builds on the other two release platforms, for every PR and main commit.
    name: Platform checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runs the Rust tests for more than 30 minutes.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build
      # Report every failing test binary, not only the first, so one run shows them all.
      - name: Test Rust workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build desktop and CLI
        run: cargo build --workspace --locked

  result:
    # The one required check. It always reports, and fails unless every job above succeeded,
    # so a failed, canceled or skipped job can never look like a pass.
    name: CI result
    if: always()
    needs: [fast, quality, ui, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Summarize run times
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          # Queue and run time per job, so slow feedback shows up as waiting or as work.
          gh api --paginate "$RUN_URL/jobs" --jq '.jobs[]' | jq -rs '
            def t: fromdateiso8601;
            def mins: (. / 60 * 10 | round / 10 | tostring) + " min";
            (map(select(.name != "CI result")) | sort_by(.started_at)) as $jobs
            | ($jobs | map(.created_at | t) | min) as $start
            | "| Job | Result | Queued | Ran | Done after |",
              "| --- | --- | --- | --- | --- |",
              ($jobs[] | select(.completed_at != null and .started_at != null)
                | "| \(.name) | \(.conclusion) | \((.started_at | t) - (.created_at | t) | mins) | \((.completed_at | t) - (.started_at | t) | mins) | \((.completed_at | t) - $start | mins) |")
          ' >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read job timings for the summary."
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [[ -n "$failed" ]]; then
            while IFS= read -r line; do echo "::error::Required job did not succeed: $line"; done <<<"$failed"
            exit 1
          fi
          echo "All required jobs succeeded."
