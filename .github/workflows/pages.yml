name: Website

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    name: Request a refresh from main
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule') &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Releases arrive on tags. Give every refresh a numbered dispatch on main.
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Prepare the Pages artifact
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Build and check the site
        run: |
          npm run build:docs
          node apps/docs/check-pages.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/build/client

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check this is the latest refresh of green main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit will publish after Quality passes."
            exit 0
          fi
          # A newer dispatch supersedes older release snapshots for this same
          # commit, even when their builds finish and join the queue out of order.
          latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --commit "$GITHUB_SHA" --event workflow_dispatch --limit 1 --json number --jq '.[0].number // error("Missing website refresh")')
          if [[ "$latest" != "$GITHUB_RUN_NUMBER" ]]; then
            echo "A newer website refresh owns this deployment."
            exit 0
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml --branch main --commit "$GITHUB_SHA" --status success --json event --jq 'any(.[]; .event == "push" or .event == "schedule")')
          if [[ "$passed" != true ]]; then
            echo "Quality has not passed for this main commit. Its successful run will request a refresh."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
