name: CI experiment

# Temporary (#561, PR A): measures each runner setting on its own before the shared setup keeps
# it. Removed before this pull request merges.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, debug-info, d-temp, defender, rust-lld, all]
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply variant
        shell: pwsh
        run: |
          $v = $env:VARIANT
          if ($v -in 'debug-info', 'all') { "CARGO_PROFILE_DEV_DEBUG=line-tables-only" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          if ($v -in 'rust-lld', 'all') { "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          if ($v -in 'd-temp', 'all') {
            New-Item -ItemType Directory -Force -Path D:\tmp | Out-Null
            "TMP=D:\tmp", "TEMP=D:\tmp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          if ($v -in 'defender', 'all') {
            Set-MpPreference -DisableRealtimeMonitoring $true
            Get-MpPreference | Select-Object DisableRealtimeMonitoring
          }
          "CARGO_INCREMENTAL=0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build
      - run: rustup show active-toolchain
      - name: Compile tests
        run: cargo test --workspace --locked --no-run
      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast
      - name: Target size
        if: always()
        run: du -sh target || true

  node-cache-save:
    name: node_modules save (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@10.9.2
      - name: npm ci (timed)
        run: time npm ci
      - run: du -sh node_modules apps/*/node_modules 2>/dev/null || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: experiment-node-modules-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  node-cache-restore:
    name: node_modules restore (${{ matrix.os }})
    needs: node-cache-save
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: experiment-node-modules-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Restored node_modules works
        run: npm run typecheck && npm run build
