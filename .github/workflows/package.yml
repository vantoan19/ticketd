name: Package

# Manual builds of the installable packages. Kept out of the Quality workflow so its required
# "CI result" check always runs the full set of checks and never reports a skip.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: distribution
        options:
          - distribution
          - linux-distribution
          - native-smoke

permissions:
  contents: read

jobs:
  native-smoke:
    if: inputs.target == 'native-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install desktop and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build
      - run: npm run desktop -- build --debug --no-bundle
      - run: cargo build -p ticketd-cli --locked
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Run real desktop refresh smoke test
        run: |
          XDG_DATA_HOME="$(mktemp -d)"
          export XDG_DATA_HOME
          active_group=
          stop_group() {
            local group="$1"
            if kill -0 -- "-$group" 2>/dev/null; then
              kill -TERM -- "-$group" 2>/dev/null || true
              for _ in {1..40}; do
                if ! kill -0 -- "-$group" 2>/dev/null; then return 0; fi
                sleep 0.25
              done
              kill -KILL -- "-$group" 2>/dev/null || true
              for _ in {1..20}; do
                if ! kill -0 -- "-$group" 2>/dev/null; then return 0; fi
                sleep 0.25
              done
              echo "Native smoke process group $group did not stop" >&2
              return 1
            fi
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$active_group" ]]; then stop_group "$active_group" || status=1; fi
            for _ in {1..20}; do
              if rm -rf "$XDG_DATA_HOME"; then exit "$status"; fi
              sleep 0.25
            done
            echo "Could not remove native smoke workspace: $XDG_DATA_HOME" >&2
            exit 1
          }
          trap cleanup EXIT
          run_native() {
            local script="$1" status=0
            # shellcheck disable=SC2016 # $driver expands in the inner sh.
            setsid xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node "$1"' sh "$script" &
            active_group=$!
            wait "$active_group" || status=$?
            stop_group "$active_group" || status=1
            active_group=
            return "$status"
          }
          # The same installed-app checks the Linux distribution runs, against the
          # debug build, so a branch can prove them before the main-only release build.
          export TICKETD_SMOKE_CHECKOUT="$PWD"
          export TICKETD_SMOKE_CLI="$PWD/target/debug/ticketd"
          export TICKETD_SMOKE_DESKTOP="$PWD/target/debug/ticketd-desktop"
          XDG_DATA_HOME="$XDG_DATA_HOME/install" run_native tests/native/install.mjs
          XDG_DATA_HOME="$XDG_DATA_HOME/refresh" run_native tests/native/refresh.mjs
          XDG_DATA_HOME="$XDG_DATA_HOME/workflow" run_native tests/native/workflow.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: native-smoke-diagnostics
          path: native-failure.*
          if-no-files-found: ignore
          retention-days: 7

  distribution:
    # Credential-bearing builds use reviewed main only, never a PR or arbitrary branch.
    if: inputs.target != 'native-smoke' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'linux-distribution' && '[{"os":"ubuntu-24.04","platform":"ubuntu-24.04-x86_64","bundle":"deb","installer":"target/release/bundle/deb/*.deb","cli":"target/release/ticketd"}]' || '[{"os":"macos-26","platform":"macos-arm64","bundle":"dmg","installer":"target/release/bundle/dmg/*.dmg","cli":"target/release/ticketd"},{"os":"ubuntu-24.04","platform":"ubuntu-24.04-x86_64","bundle":"deb","installer":"target/release/bundle/deb/*.deb","cli":"target/release/ticketd"},{"os":"windows-2025","platform":"windows-x86_64","bundle":"msi","installer":"target/release/bundle/msi/*.msi","cli":"target/release/ticketd.exe"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # One Desktop app OAuth client serves every platform; it is a public client.
      TICKETD_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.TICKETD_GOOGLE_OAUTH_CLIENT_JSON }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require publisher Google app registration
        run: |
          if [[ -z "$TICKETD_GOOGLE_OAUTH_CLIENT_JSON" ]]; then
            echo "::error::Configure the TICKETD_GOOGLE_OAUTH_CLIENT_JSON repository secret with the Desktop OAuth client JSON before building a distribution."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup show active-toolchain
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - name: Check package versions
        run: node scripts/check-versions.mjs
      - name: Validate bundled Google app registration
        run: cargo test -p ticketd-core --lib drive::oauth::tests::distribution_client_is_valid --locked
      - name: Build CLI
        run: cargo build --release --locked -p ticketd-cli
      - name: Build desktop installer
        run: npm run desktop -- build --bundles ${{ matrix.bundle }} -- --locked
      - name: Smoke-test installed Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.1.0 --locked
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          package=$(dpkg-deb -f target/release/bundle/deb/*.deb Package)
          XDG_DATA_HOME="$(mktemp -d)"
          export XDG_DATA_HOME
          export TICKETD_SMOKE_CHECKOUT="$PWD"
          export TICKETD_SMOKE_CLI="$PWD/target/release/ticketd"
          export TICKETD_SMOKE_DESKTOP=/usr/bin/ticketd-desktop
          trap 'rm -rf "$XDG_DATA_HOME"' EXIT
          # shellcheck disable=SC2016 # $driver expands in the inner sh.
          xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/install.mjs'
          # shellcheck disable=SC2016 # $driver expands in the inner sh.
          XDG_DATA_HOME="$XDG_DATA_HOME/refresh" xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/refresh.mjs'
          # shellcheck disable=SC2016 # $driver expands in the inner sh.
          XDG_DATA_HOME="$XDG_DATA_HOME/workflow" xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/workflow.mjs'
          sudo apt-get remove -y "$package"
          "$TICKETD_SMOKE_CLI" list | node -e 'let s=""; process.stdin.on("data", x => s += x); process.stdin.on("end", () => { if (!JSON.parse(s).some(t => t.title === "Created while desktop was closed")) process.exit(1); });'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && runner.os == 'Linux'
        with:
          name: installed-workflow-diagnostics
          path: native-failure.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble download
        run: |
          mkdir -p distribution
          cp ${{ matrix.installer }} distribution/
          cp ${{ matrix.cli }} distribution/
          cp docs/install.md distribution/INSTALL.md
      - name: Smoke-test CLI installation and discovery
        run: node tests/native/cli-install.mjs ${{ matrix.cli }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ticketd-${{ matrix.platform }}
          path: distribution/
          if-no-files-found: error
          retention-days: 7
