name: Package

# Manual builds of the installable packages from main, and the Linux native smoke test on any
# branch. Kept out of the Quality workflow so its required "CI result" check always runs the full
# set of checks and never reports a skip. The Release workflow builds every green main commit.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: distribution
        options:
          - distribution
          - linux-distribution
          - native-smoke

permissions:
  contents: read

jobs:
  native-smoke:
    if: inputs.target == 'native-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install desktop and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - run: rustup show active-toolchain
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run build
      - run: npm run desktop -- build --debug --bundles deb -- --locked
      - name: Check the CLI in the Debian package
        run: |
          package_root=$(mktemp -d)
          trap 'rm -rf "$package_root"' EXIT
          dpkg-deb --extract target/debug/bundle/deb/*.deb "$package_root"
          export TICKETD_TEST_WORKSPACE="$package_root/workspace.sqlite3"
          test "$("$package_root/usr/bin/ticketd" --version)" = "$(target/debug/ticketd --version)"
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Run real desktop refresh smoke test
        run: |
          XDG_DATA_HOME="$(mktemp -d)"
          export XDG_DATA_HOME
          active_group=
          stop_group() {
            local group="$1"
            if kill -0 -- "-$group" 2>/dev/null; then
              kill -TERM -- "-$group" 2>/dev/null || true
              for _ in {1..40}; do
                if ! kill -0 -- "-$group" 2>/dev/null; then return 0; fi
                sleep 0.25
              done
              kill -KILL -- "-$group" 2>/dev/null || true
              for _ in {1..20}; do
                if ! kill -0 -- "-$group" 2>/dev/null; then return 0; fi
                sleep 0.25
              done
              echo "Native smoke process group $group did not stop" >&2
              return 1
            fi
          }
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ -n "$active_group" ]]; then stop_group "$active_group" || status=1; fi
            for _ in {1..20}; do
              if rm -rf "$XDG_DATA_HOME"; then exit "$status"; fi
              sleep 0.25
            done
            echo "Could not remove native smoke workspace: $XDG_DATA_HOME" >&2
            exit 1
          }
          trap cleanup EXIT
          run_native() {
            local script="$1" status=0
            # shellcheck disable=SC2016 # $driver expands in the inner sh.
            setsid xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node "$1"' sh "$script" &
            active_group=$!
            wait "$active_group" || status=$?
            stop_group "$active_group" || status=1
            active_group=
            return "$status"
          }
          # The same installed-app checks the Linux distribution runs, against the
          # debug build, so a branch can prove them before the main-only release build.
          export TICKETD_SMOKE_CHECKOUT="$PWD"
          export TICKETD_SMOKE_CLI="$PWD/target/debug/ticketd"
          export TICKETD_SMOKE_DESKTOP="$PWD/target/debug/ticketd-desktop"
          XDG_DATA_HOME="$XDG_DATA_HOME/install" run_native tests/native/install.mjs
          XDG_DATA_HOME="$XDG_DATA_HOME/refresh" run_native tests/native/refresh.mjs
          XDG_DATA_HOME="$XDG_DATA_HOME/workflow" run_native tests/native/workflow.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: native-smoke-diagnostics
          path: native-failure.*
          if-no-files-found: ignore
          retention-days: 7

  distribution:
    # Credential-bearing builds use reviewed main only, never a PR or arbitrary branch.
    if: inputs.target != 'native-smoke' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/distribution.yml
    with:
      sha: ${{ github.sha }}
      linux-only: ${{ inputs.target == 'linux-distribution' }}
      retention-days: 7
    secrets:
      TICKETD_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.TICKETD_GOOGLE_OAUTH_CLIENT_JSON }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
