name: Distribution

# The one packaging implementation: the desktop installer and the release CLI for each platform.
# Package (manual builds) and Release (every green main commit, and release drafts) call it, so a
# draft release ships the same build the per-commit packages test. Callers pass a reviewed main
# commit; this workflow reads the distribution secrets.
on:
  workflow_call:
    inputs:
      sha:
        description: Full SHA of the main commit to build
        type: string
        required: true
      version:
        description: Build-time version override. Patched into this build's checkout only and never committed.
        type: string
        default: ""
      linux-only:
        description: Build only the Ubuntu package
        type: boolean
        default: false
      retention-days:
        description: Days to keep the uploaded packages
        type: number
        default: 7
    secrets:
      # Not marked required so a missing secret fails the build with a clear message instead.
      TICKETD_GOOGLE_OAUTH_CLIENT_JSON:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux-only && '[{"os":"ubuntu-24.04","platform":"ubuntu-24.04-x86_64","bundle":"deb","installer":"target/release/bundle/deb/*.deb","cli":"target/release/ticketd"}]' || '[{"os":"macos-26","platform":"macos-arm64","bundle":"dmg","installer":"target/release/bundle/dmg/*.dmg","cli":"target/release/ticketd"},{"os":"ubuntu-24.04","platform":"ubuntu-24.04-x86_64","bundle":"deb","installer":"target/release/bundle/deb/*.deb","cli":"target/release/ticketd"},{"os":"windows-2025","platform":"windows-x86_64","bundle":"msi","installer":"target/release/bundle/msi/*.msi","cli":"target/release/ticketd.exe"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # One Desktop app OAuth client serves every platform; it is a public client.
      TICKETD_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.TICKETD_GOOGLE_OAUTH_CLIENT_JSON }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the commit to build
        id: commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pass the full SHA of the commit to build, not \"$SHA\"."
            exit 1
          fi
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Require publisher Google app registration
        run: |
          if [[ -z "$TICKETD_GOOGLE_OAUTH_CLIENT_JSON" ]]; then
            echo "::error::Configure the TICKETD_GOOGLE_OAUTH_CLIENT_JSON repository secret with the Desktop OAuth client JSON before building a distribution."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup show active-toolchain
      - run: npm install --global npm@10.9.2
      - name: Apply the build version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs set "$VERSION"
      - run: npm ci
      - name: Check package versions
        run: node scripts/check-versions.mjs
      - name: Validate bundled Google app registration
        run: cargo test -p ticketd-core --lib drive::oauth::tests::distribution_client_is_valid --locked
      - name: Build CLI
        run: cargo build --release --locked -p ticketd-cli
      - name: Build desktop installer
        id: installer
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INSTALLER_BUNDLE: ${{ matrix.bundle }}
        run: |
          bundle="$INSTALLER_BUNDLE"
          updater=()
          if [[ -n "$TAURI_UPDATER_PUBLIC_KEY" && -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            updater=(--updater)
            # The macOS updater archives the app bundle alongside the DMG installer.
            if [[ "$bundle" == dmg ]]; then bundle=app,dmg; fi
          else
            echo "::warning::Skipping updater files. Configure TAURI_UPDATER_PUBLIC_KEY, TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD to enable updater signing."
          fi
          # The updater public key, and an MSI version for a prerelease Windows Installer cannot read.
          config="$RUNNER_TEMP/ticketd-build.json"
          node scripts/release-version.mjs tauri-config "$config" "${updater[@]}"
          npm run desktop -- build --bundles "$bundle" --config "$config" -- --locked
          if [[ ${#updater[@]} -gt 0 ]]; then echo 'signed_updater=true' >> "$GITHUB_OUTPUT"; fi
      - name: Check macOS installer includes Linear
        if: runner.os == 'macOS'
        run: |
          mount="$(mktemp -d)"
          hdiutil attach target/release/bundle/dmg/*.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" && rmdir "$mount"' EXIT
          test -x "$mount/ticketd.app/Contents/MacOS/ticketd-source-linear"
      - name: Check Windows installer includes Linear
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $folder = Join-Path $env:RUNNER_TEMP "ticketd-msi-contents"
          $process = Start-Process msiexec.exe -ArgumentList ('/a "' + $installer.FullName + '" /qn TARGETDIR="' + $folder + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI extraction exited with $($process.ExitCode)" }
          if (!(Get-ChildItem $folder -Recurse -File -Filter ticketd-source-linear.exe)) {
            throw "The MSI did not include the Linear extension"
          }
      - name: Smoke-test installed Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --version 2.1.0 --locked
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          package=$(dpkg-deb -f target/release/bundle/deb/*.deb Package)
          XDG_DATA_HOME="$(mktemp -d)"
          export XDG_DATA_HOME
          export TICKETD_SMOKE_CHECKOUT="$PWD"
          export TICKETD_SMOKE_CLI=/usr/bin/ticketd
          export TICKETD_SMOKE_DESKTOP=/usr/bin/ticketd-desktop
          trap 'rm -rf "$XDG_DATA_HOME"' EXIT
          test -x /usr/bin/ticketd-source-linear
          test "$("$TICKETD_SMOKE_CLI" --version)" = "$(target/release/ticketd --version)"
          # shellcheck disable=SC2016 # $driver expands in the inner sh.
          xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/install.mjs'
          # shellcheck disable=SC2016 # $driver expands in the inner sh.
          XDG_DATA_HOME="$XDG_DATA_HOME/refresh" xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/refresh.mjs'
          # shellcheck disable=SC2016 # $driver expands in the inner sh.
          XDG_DATA_HOME="$XDG_DATA_HOME/workflow" xvfb-run -a sh -c 'tauri-driver & driver=$!; trap "kill $driver; wait $driver 2>/dev/null" EXIT; node tests/native/workflow.mjs'
          sudo apt-get remove -y "$package"
          test ! -e "$TICKETD_SMOKE_CLI"
          target/release/ticketd list | node -e 'let s=""; process.stdin.on("data", x => s += x); process.stdin.on("end", () => { if (!JSON.parse(s).some(t => t.title === "Created while desktop was closed")) process.exit(1); });'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && runner.os == 'Linux'
        with:
          name: installed-workflow-diagnostics-${{ steps.commit.outputs.short }}
          path: native-failure.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble download
        env:
          SIGNED_UPDATER: ${{ steps.installer.outputs.signed_updater }}
        run: |
          mkdir -p distribution
          cp ${{ matrix.installer }} distribution/
          cp ${{ matrix.cli }} distribution/
          cp docs/install.md distribution/INSTALL.md
          if [[ "$SIGNED_UPDATER" == true ]]; then
            if [[ "$RUNNER_OS" == macOS ]]; then
              cp target/release/bundle/macos/*.app.tar.gz{,.sig} distribution/
            else
              cp ${{ matrix.installer }}.sig distribution/
            fi
          fi
      - name: Smoke-test CLI installation and discovery
        run: node tests/native/cli-install.mjs ${{ matrix.cli }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The Release workflow's draft job downloads these by this name.
          name: ticketd-${{ matrix.platform }}-${{ steps.commit.outputs.short }}
          path: distribution/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
