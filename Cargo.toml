[workspace]
members = ["crates/ticketd-core", "crates/ticketd-cli", "crates/ticketd-chat-host", "crates/ticketd-automation-runner", "apps/desktop/src-tauri"]
default-members = ["crates/ticketd-core", "crates/ticketd-cli", "crates/ticketd-chat-host", "crates/ticketd-automation-runner"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/vantoan19/ticketd"

[workspace.dependencies]
ticketd-core = { path = "crates/ticketd-core" }
ticketd-chat-host = { path = "crates/ticketd-chat-host" }
ticketd-automation-runner = { path = "crates/ticketd-automation-runner" }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
