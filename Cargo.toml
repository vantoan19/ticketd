[workspace]
members = ["crates/ticketd-core", "crates/ticketd-cli", "apps/desktop/src-tauri"]
default-members = ["crates/ticketd-core", "crates/ticketd-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
ticketd-core = { path = "crates/ticketd-core" }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
