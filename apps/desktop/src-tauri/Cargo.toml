[package]
name = "ticketd-desktop"
description = "Desktop application for ticketd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "ticketd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-updater.workspace = true
ticketd-chat-host.workspace = true
ticketd-automation-runner.workspace = true
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
ticketd-core.workspace = true
ticketd-diagnostics.workspace = true
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[dev-dependencies]
# The host's sync tests run against the core's in-memory storage.
ticketd-core = { workspace = true, features = ["fake-remote"] }
tempfile = "3"
# The runtime trace holds the write lock as another process would.
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
